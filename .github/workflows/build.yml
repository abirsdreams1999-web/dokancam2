name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Create project and build
        run: |
          mkdir -p proj && cd proj
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DokanCam"
          include(":app")
          EOF_FILE
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.dokan.cam"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.dokan.cam"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("org.videolan.android:libvlc-all:3.6.0")
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
              </queries>
              <application
                  android:label="Dokan Cam"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/dokan/cam/MainActivity.kt)
          cat > app/src/main/java/com/dokan/cam/MainActivity.kt <<'EOF_FILE'
          package com.dokan.cam

          import android.Manifest
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.os.*
          import android.provider.MediaStore
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.view.*
          import android.widget.*
          import org.videolan.libvlc.LibVLC
          import org.videolan.libvlc.Media
          import org.videolan.libvlc.MediaPlayer
          import org.videolan.libvlc.util.VLCVideoLayout
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : Activity() {
              private lateinit var libVLC: LibVLC
              private lateinit var player: MediaPlayer
              private lateinit var videoLayout: VLCVideoLayout
              private lateinit var urlEdit: EditText
              private lateinit var status: TextView
              private val handler = Handler(Looper.getMainLooper())
              private var sr: SpeechRecognizer? = null
              private var listening = false
              private var recording = false
              private var curFolder = ""
              private var lastCmd = 0L
              private val autoStop = Runnable { stopRecord() }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  val prefs = getSharedPreferences("p", MODE_PRIVATE)
                  libVLC = LibVLC(this, arrayListOf("--rtsp-tcp", "--network-caching=300"))
                  player = MediaPlayer(libVLC)
                  videoLayout = VLCVideoLayout(this)
                  player.attachViews(videoLayout, null, false, false)
                  urlEdit = EditText(this).apply {
                      setText(prefs.getString("url", "rtsp://192.168.0.105/live/ch00_0"))
                      setSingleLine()
                  }
                  status = TextView(this).apply { setPadding(16, 8, 16, 8); text = "Ready" }
                  fun btn(t: String, f: () -> Unit) = Button(this).apply {
                      text = t; textSize = 12f; isAllCaps = false
                      setOnClickListener { f() }
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(btn("Connect") {
                          prefs.edit().putString("url", urlEdit.text.toString().trim()).apply()
                          connect()
                      })
                      addView(btn("Shot") { screenshot() })
                      addView(btn("Rec") { startRecord("Records") })
                      addView(btn("Stop") { stopRecord() })
                      addView(btn("Voice") { toggleVoice() })
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      fitsSystemWindows = true
                      addView(urlEdit); addView(row); addView(status)
                      addView(videoLayout, LinearLayout.LayoutParams(-1, 0, 1f))
                  }
                  setContentView(root)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
              }

              private fun say(t: String) = runOnUiThread { status.text = t }
              private fun stamp() = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())

              private fun connect() {
                  val m = Media(libVLC, android.net.Uri.parse(urlEdit.text.toString().trim()))
                  m.addOption(":network-caching=300")
                  player.media = m
                  m.release()
                  player.play()
                  say("Connecting...")
              }

              private fun startRecord(folder: String) {
                  if (!player.isPlaying) { say("Age Connect korun"); return }
                  if (recording && curFolder == folder) return
                  if (recording) stopRecord()
                  val dir = File(getExternalFilesDir(Environment.DIRECTORY_MOVIES), folder).apply { mkdirs() }
                  recording = player.record(dir.absolutePath)
                  curFolder = folder
                  say(if (recording) "Recording... ($folder)" else "Record shuru hoyni")
              }

              private fun stopRecord() {
                  handler.removeCallbacks(autoStop)
                  if (recording) { player.record(null); recording = false; say("Record shesh, save hoyeche") }
              }

              private fun bakiRecord() {
                  startRecord("Baki")
                  handler.removeCallbacks(autoStop)
                  handler.postDelayed(autoStop, 120_000)
              }

              private fun findSurface(v: View): SurfaceView? {
                  if (v is SurfaceView) return v
                  if (v is ViewGroup) for (i in 0 until v.childCount) findSurface(v.getChildAt(i))?.let { return it }
                  return null
              }

              private fun screenshot() {
                  val sv = findSurface(videoLayout)
                  if (sv == null || sv.width == 0 || !player.isPlaying) { say("Video chalu nai"); return }
                  val bmp = Bitmap.createBitmap(sv.width, sv.height, Bitmap.Config.ARGB_8888)
                  PixelCopy.request(sv, bmp, { r ->
                      if (r == PixelCopy.SUCCESS) saveShot(bmp) else say("Screenshot fail")
                  }, handler)
              }

              private fun saveShot(b: Bitmap) {
                  val v = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, "shot_${stamp()}.jpg")
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                      put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/DokanCam")
                  }
                  contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v)?.let { u ->
                      contentResolver.openOutputStream(u)?.use { b.compress(Bitmap.CompressFormat.JPEG, 95, it) }
                      say("Screenshot save hoyeche (Gallery > DokanCam)")
                  }
              }

              // ---- Voice ----
              private fun toggleVoice() {
                  if (listening) { listening = false; sr?.destroy(); sr = null; say("Voice OFF"); return }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1); return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { say("Speech service nai"); return }
                  listening = true
                  sr = SpeechRecognizer.createSpeechRecognizer(this).apply { setRecognitionListener(listener) }
                  say("Voice ON: baki / screenshot / record / stop")
                  listen()
              }

              private fun listen() {
                  if (!listening) return
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                      .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  sr?.startListening(i)
              }

              private fun words(b: Bundle?) {
                  val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.joinToString(" ")?.lowercase() ?: return
                  if (SystemClock.elapsedRealtime() - lastCmd < 3000) return
                  fun has(vararg k: String) = k.any { t.contains(it) }
                  when {
                      has("baki", "baky", "বাকি", "বাকী") -> bakiRecord()
                      has("stop", "স্টপ", "থামো", "বন্ধ") -> stopRecord()
                      has("screenshot", "স্ক্রিনশট", "স্ক্রীনশট") -> screenshot()
                      has("record", "রেকর্ড") -> startRecord("Records")
                      else -> return
                  }
                  lastCmd = SystemClock.elapsedRealtime()
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(p: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(v: Float) {}
                  override fun onBufferReceived(b: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onEvent(t: Int, p: Bundle?) {}
                  override fun onPartialResults(b: Bundle?) = words(b)
                  override fun onResults(b: Bundle?) { words(b); handler.postDelayed({ listen() }, 200) }
                  override fun onError(e: Int) { handler.postDelayed({ listen() }, 500) }
              }

              override fun onDestroy() {
                  listening = false
                  sr?.destroy()
                  player.release(); libVLC.release()
                  super.onDestroy()
              }
          }
          EOF_FILE
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DokanCam-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
